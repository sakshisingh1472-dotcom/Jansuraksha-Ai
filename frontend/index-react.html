<!DOCTYPE html>
<html>
<head>
<title>Jansuraksha AI</title>
<style>
body{background:#0a0a0a;color:white;font-family:sans-serif;padding:20px}
.box{background:#1a1a1a;border:1px solid #333;padding:20px;border-radius:12px;margin-bottom:20px}
button{background:#00ff88;border:none;padding:10px 20px;border-radius:8px;font-weight:bold;cursor:pointer}
#result{margin-top:15px}
img{max-width:100%;border:2px solid #00ff88;margin-top:10px;border-radius:8px}
</style>
</head>
<body>
<h1>🛡️ JANSURAKSHA AI - Border CCTV</h1>
<p>Backend: <span style="color:#00ff88">http://127.0.0.1:8000 - CONNECTED</span></p>

<div class="box">
<h3>1. Image Analysis (Accurate Count)</h3>
<input type="file" id="imgFile" accept="image/*">
<button onclick="analyzeImg()">Analyze Image</button>
<div id="result">
<h2 id="count" style="color:#00ff88">Count: --</h2>
<p id="status" style="color:orange">Status: --</p>
<img id="outImg" style="display:none">
</div>
</div>

<div class="box">
<h3>2. Video Analysis</h3>
<input type="file" id="vidFile" accept="video/*">
<button onclick="analyzeVid()">Analyze Video</button>
<h3 id="vidCount">Max Count: --</h3>
</div>

<script>
async function analyzeImg(){
 const f=document.getElementById('imgFile').files[0];
 if(!f){alert("Image select kar");return;}
 document.getElementById('count').innerText="Analyzing...";
 const fd=new FormData(); fd.append('file',f);
 const res=await fetch('http://127.0.0.1:8000/api/analyze-image',{method:'POST',body:fd});
 const data=await res.json();
 document.getElementById('count').innerText="Count: "+(data.count?? data.people_count);
 document.getElementById('status').innerText="Status: "+data.status;
 if(data.border_image){
  const img=document.getElementById('outImg');
  img.src="data:image/jpeg;base64,"+data.border_image;
  img.style.display="block";
 }
}
async function analyzeVid(){
 const f=document.getElementById('vidFile').files[0];
 if(!f){alert("Video select kar");return;}
 document.getElementById('vidCount').innerText="Analyzing video...";
 const fd=new FormData(); fd.append('file',f);
 const res=await fetch('http://127.0.0.1:8000/api/analyze-video',{method:'POST',body:fd});
 const data=await res.json();
 document.getElementById('vidCount').innerText="Max Count: "+(data.count?? data.people_count);
}
</script>
</body>
</html>
