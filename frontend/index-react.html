<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Jansuraksha AI - Border CCTV</title>
<script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head><body class="bg-black"><div id="root"></div>
<script type="text/babel">
function App(){
  const [count,setCount]=React.useState(null); const [status,setStatus]=React.useState(""); const [img,setImg]=React.useState(null); const [loading,setLoading]=React.useState(false); const [mode,setMode]=React.useState("image");
  const handleFile=async(e)=>{
    const file=e.target.files[0]; if(!file) return; setLoading(true);
    const fd=new FormData(); fd.append("file",file);
    const url = mode==="image"? "http://127.0.0.1:8000/analyze-image" : "http://127.0.0.1:8000/analyze-video";
    try{ const res=await fetch(url,{method:"POST",body:fd}); const data=await res.json(); setCount(data.people_count); setStatus(data.status); setImg(data.border_image); } catch(err){ alert("Backend 8000 pe on rakho!"); } setLoading(false);
  }
  return(<div className="min-h-screen bg-black text-white p-6"><h1 className="text-3xl font-black">JANSURAKSHA AI - BORDER CCTV</h1><p className="text-gray-400 mb-4">Image + Video | Exact Count with Tiling | Border Alert &gt;10 = RED</p>
  <div className="flex gap-4 mb-6"><button onClick={()=>setMode("image")} className={`px-6 py-2 rounded-full ${mode==="image"?"bg-white text-black":"bg-zinc-800"}`}>Image Mode</button><button onClick={()=>setMode("video")} className={`px-6 py-2 rounded-full ${mode==="video"?"bg-white text-black":"bg-zinc-800"}`}>Video (CCTV) Mode</button></div>
  <div className="grid md:grid-cols-2 gap-6"><div className="bg-zinc-900 p-6 rounded-2xl"><h2 className="mb-3">Upload {mode==="image"?"Image":"CCTV Video"}</h2><input type="file" accept={mode==="image"?"image/*":"video/*"} onChange={handleFile} className="bg-zinc-800 p-3 rounded w-full"/><div className="mt-4">{img && <img src={img} className="rounded-xl w-full border-2 border-red-600"/>}</div></div>
  <div className="bg-zinc-900 p-6 rounded-2xl"><h2>Live Result</h2>{loading?<p className="text-yellow-400 animate-pulse mt-6">Analysing border footage... tiling se exact count nikal raha hai...</p>:count!==null?<><div className="text-7xl font-black mt-4">{count}</div><div className={`mt-4 inline-block px-5 py-2 rounded-full font-bold text-xl ${count>10?"bg-red-600 animate-pulse":"bg-green-600"}`}>{status}</div><p className="text-sm text-gray-400 mt-4">Border pe &gt;10 log = Breach Alert</p></>:<p className="text-gray-500 mt-6">File upload kar</p>}</div></div></div>)
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>)
</script></body></html>
